name: tests

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: bookflix_test

    # No Redis service: tests run on the sync queue and array cache. Add one only if a test touches the real connection.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookflix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Setup Application
        run: composer setup

      - name: Run CI Checks
        run: composer ci:check

  # Pest browser tests (Playwright, headless Chromium) against the built assets; `composer test` does not run tests/Browser (phpunit.xml lists only
  # Unit and Feature). This job reports honestly: it goes red whenever a browser test fails. Do NOT mark `browser` as a required status check (it would
  # block every pull request on a flaky browser run); mark `browser-gate` instead (Settings > Branches > main > Require status checks > add `browser-gate`),
  # which requires a successful `browser` run on every pull request. Flakiness is fixed at the root (Phase 6 policy), never by letting the gate pass.
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: bookflix_test

    # No Redis service, as in `ci`: the tests run on the sync queue, array cache and array sessions (phpunit.xml).
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookflix_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Prepare environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Install Node dependencies
        run: npm ci

      - name: Build assets
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium --only-shell

      - name: Run browser tests
        run: vendor/bin/pest tests/Browser

  # The required check: always runs (even when `browser` fails, is cancelled by its timeout or is skipped) and passes only when `browser` succeeded.
  browser-gate:
    needs: browser
    if: always()
    runs-on: ubuntu-latest

    steps:
      - name: Require a successful browser suite
        env:
          BROWSER_RESULT: ${{ needs.browser.result }}
        run: |
          if [ "$BROWSER_RESULT" != "success" ]; then
            echo "The browser suite did not succeed: ${BROWSER_RESULT}"
            exit 1
          fi

  ml:
    runs-on: ubuntu-latest

    # The db-marked tests build their own schema in this database; without it they are skipped.
    env:
      ML_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/bookflix_ml_test

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bookflix_ml_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    defaults:
      run:
        working-directory: ml

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff
        run: uv run ruff check .

      - name: Mypy
        run: uv run mypy .

      - name: Pytest
        run: uv run pytest

  # Secret scan over the whole git history (not a required check, no `needs`). gitleaks is installed through the Go module proxy, pinned to a
  # version and verified against its module checksum (Go's checksum database checks it again on install).
  # Dependency advisories: `composer audit` over composer.lock and `npm audit` over package-lock.json (production dependencies; neither needs the
  # dependencies installed). Any advisory fails the job. Both lock files were upgraded to clear the advisories listed in
  # docs/superpowers/plans/mp2-phase-1-ledger.md ("Task 1.5 findings"), so a red run here means a new one.
  security:
    runs-on: ubuntu-latest

    env:
      GITLEAKS_VERSION: v8.30.1
      GITLEAKS_MODULE_SUM: h1:PmEvCfVI7ti9dV3s5aMZUY7sS2GxRvG3yzih7E+cS3w=
      # The runner's Go may be older than gitleaks' `go` directive; let it fetch the toolchain the module asks for.
      GOTOOLCHAIN: auto

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with:
          php-version: '8.4'
          tools: composer:v2
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Audit PHP dependencies
        run: composer audit --locked --no-interaction

      - name: Audit JavaScript dependencies
        run: npm audit --omit=dev

      - name: Install gitleaks
        run: |
          sum="$(go mod download -json "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}" | jq -r .Sum)"
          if [ "$sum" != "$GITLEAKS_MODULE_SUM" ]; then
            echo "gitleaks ${GITLEAKS_VERSION} module checksum mismatch: got ${sum}"
            exit 1
          fi
          GOBIN="$RUNNER_TEMP/bin" go install "github.com/zricethezav/gitleaks/v8@${GITLEAKS_VERSION}"

      - name: Scan history for secrets
        run: '"$RUNNER_TEMP/bin/gitleaks" git --no-banner --redact --exit-code 1 --log-opts="--all" .'
