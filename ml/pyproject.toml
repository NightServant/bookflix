[project]
name = "bookflix-ml"
version = "0.1.0"
description = "Bookflix ML service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "pydantic-settings",
    "scikit-learn>=1.9.1",
    "numpy>=2.5.4",
    "scipy>=1.18.1",
    "pandas>=3.1.0",
    "psycopg[binary]>=3.3.8",
    "pgvector>=0.5.1",
    "joblib>=1.6.0",
    "boto3>=1.43.123",
    "implicit>=0.7.3",
]

[dependency-groups]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "mypy",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["db: needs a Postgres database with pgvector at ML_TEST_DATABASE_URL (skipped when it is unset)"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Long SQL strings and docstrings are left as written; the formatter wraps code.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "bookflix_ml", "tests"]
explicit_package_bases = true
mypy_path = "."

[[tool.mypy.overrides]]
module = ["sklearn.*", "implicit.*", "joblib", "boto3", "scipy.*", "pgvector.*"]
ignore_missing_imports = true
